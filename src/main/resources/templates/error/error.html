<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ошибка</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-error-page">

<button type="button" class="top-left-button error-back-button" onclick="goBack()">Назад</button>

<div class="app-error-container">
    <div class="app-error-card">
        <div class="app-error-code" th:text="${status != null ? status : 'Ошибка'}">Ошибка</div>

        <h1>Что-то пошло не так</h1>

        <p>
            При обработке запроса возникла ошибка.
            Подробная техническая информация скрыта для безопасности.
        </p>

        <p class="app-error-note">
            Работа по исправлению данной ошибки уже ведётся.
        </p>

        <a th:href="@{/}" class="btn app-error-home-btn">На главную</a>
    </div>
</div>

<script>
    function goBack() {
        if (window.history.length > 1) {
            window.history.back();
        } else {
            window.location.href = "/";
        }
    }
</script>

</body>
</html>
